name: Flask CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Flask application
        run: |
          python -c "from app import app; response = app.test_client().get('/'); assert response.status_code == 200; print(response.data.decode())"

      - name: Build Docker image
        run: |
          docker build -t jenkins-flask-app:github-actions .
